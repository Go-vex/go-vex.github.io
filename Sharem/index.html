<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharem Spa - Enlaces</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PRECARGA DE LA IMAGEN LOCAL -->
    <link rel="preload" as="image" href="mishelle.webp">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBase: '#0a1518',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0a1518;
            color: #ffffff;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Fondo Hero anclado exactamente al centro superior */
        .fondo-hero {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            max-width: 500px;
            height: 100dvh;
            z-index: 0;
            background-image: url('mishelle.webp');
            background-size: cover;
            background-position: 50% 0%;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        /* Degradado inferior suave */
        .fondo-hero::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(10, 21, 24, 0) 42%,      
                rgba(10, 21, 24, 0.80) 64%,   
                #0a1518 82%                  
            );
        }

        /* Contenedor principal centrado sin conflictos */
        .main-container {
            min-height: 100dvh;
            padding-top: 63vh;
            padding-bottom: 2.5rem;
            padding-left: 1.25rem;
            padding-right: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 448px;
            margin: 0 auto;
        }

        /* Estilo Glassmorphism */
        .btn-glass {
            border-radius: 9999px;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            background-color: rgba(14, 28, 31, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        a.btn-glass:active, button.btn-glass:active {
            transform: scale(0.98);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .btn-glass.active-wifi {
            border-color: rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Panel desplegable Wi-Fi */
        #wifi-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.35s ease;
            border-radius: 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            background-color: rgba(14, 28, 31, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #wifi-panel.open {
            max-height: 220px;
            opacity: 1;
            margin-top: 0.75rem;
        }
    </style>
</head>

            <!-- Panel Desplegable Wi-Fi -->

                            <span class="font-semibold text-[0.95rem]">INFINITUM4DD7</span>

                        <button onclick="toggleWifi()" type="button" class="text-xs text-gray-300 hover:text-white flex items-center gap-1 px-2 py-1 rounded-md bg-white/10">

                    <div class="flex items-center justify-between bg-black/40 rounded-xl px-4 py-2.5 border border-white/15">

                            <span class="font-mono font-semibold text-[1.05rem] tracking-wide">kiNwn9Ww9C</span>

                        <button onclick="copyPassword()" id="copy-btn" type="button" class="flex items-center gap-1.5 bg-white/20 hover:bg-white/30 transition-colors px-3.5 py-2 rounded-lg text-sm font-semibold active:scale-95">

    <!-- Scripts -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const img = new Image();
            img.onload = () => {
                document.getElementById('bg-layer').style.opacity = '1';
            };
            img.src = 'mishelle.webp';
        });

        function toggleWifi() {
            const panel = document.getElementById('wifi-panel');
            const trigger = document.getElementById('wifi-trigger');
            const isOpen = panel.classList.toggle('open');
            trigger.classList.toggle('active-wifi', isOpen);
            
            if (isOpen) {
                setTimeout(() => {
                    window.scrollBy({
                        top: 180, 
                        left: 0, 
                        behavior: 'smooth'
                    });
                }, 200); 
            }
        }

        function copyPassword() {
            const passwordStr = "kiNwn9Ww9C";
            const copyBtn = document.getElementById('copy-btn');
            
            const triggerSuccess = () => {
                const originalHtml = copyBtn.innerHTML;
                copyBtn.innerHTML = `
                    <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-green-400">¡Copiado!</span>
                `;
                copyBtn.classList.add('bg-green-500/20');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.classList.remove('bg-green-500/20');
                }, 2000);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(passwordStr).then(triggerSuccess).catch(() => fallbackCopy(passwordStr, triggerSuccess));
            } else {
                fallbackCopy(passwordStr, triggerSuccess);
            }
        }

        function fallbackCopy(text, callback) {
            const tempInput = document.createElement("input");
            tempInput.value = text;
            tempInput.setAttribute("readonly", "");
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            try {
                document.execCommand("copy");
                callback();
            } catch (err) {
                console.error("Error al copiar: ", err);
            }
            document.body.removeChild(tempInput);
        }
    </script>
</body>
