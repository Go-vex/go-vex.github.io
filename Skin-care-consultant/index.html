<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#c8c5c0">
    <title>SKIN Care Consultant</title>
    
    <!-- Precarga prioritaria del fondo para carga instantánea -->
    <link rel="preload" as="image" href="Paloma.webp" fetchpriority="high">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #b8b5b0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* En escritorio se mantiene como tarjeta 9:16 centrada */
        .canvas-wrapper {
            position: relative;
            width: min(100vw, 56.25dvh);
            max-width: 430px;
            aspect-ratio: 9 / 16;
            container-type: inline-size;
            background-color: #d5d2cd;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.25);
        }

        /* En celular ancla de borde a borde incluyendo la zona de la barra inferior */
        @media (max-width: 480px) {
            .canvas-wrapper {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                max-width: none;
                aspect-ratio: auto;
                box-shadow: none;
            }
        }

        /* Imagen de fondo cubriendo toda la pantalla sin bordes vacíos */
        .bg-full {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* Bloque de botones: tamaño y altura exactos */
        .buttons-stack {
            position: absolute;
            top: 45.3%;
            left: 7.4%;
            right: 7.4%;
            display: flex;
            flex-direction: column;
            gap: 3.35cqw;
            z-index: 10;
        }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 16.15cqw;
            padding: 0 5.8cqw 0 4.8cqw;
            border-radius: 4cqw;
            text-decoration: none;
            transition: transform 0.14s ease, filter 0.14s ease;
        }

        .btn-card:active {
            transform: scale(0.985);
            filter: brightness(0.97);
        }

        /* 1er botón: Déjanos tu reseña */
        .btn-review {
            background-color: #efe9fa;
            border: 1px solid rgba(124, 58, 237, 0.22);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        /* Botones blancos: Instagram, Facebook, Contáctanos */
        .btn-white {
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 4.2cqw;
        }

        .icon-box {
            width: 8.6cqw;
            height: 8.6cqw;
            border-radius: 2.3cqw;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 4.3cqw;
            height: 4.3cqw;
        }

        .icon-box-review {
            background-color: rgba(124, 58, 237, 0.08);
            border: 1px solid rgba(124, 58, 237, 0.16);
            color: #6d28d9;
        }

        .icon-box-neutral {
            background-color: #f4f4f5;
            color: #27272a;
        }

        .btn-label {
            font-size: 4.05cqw;
            font-weight: 500;
            color: #1f1f23;
            letter-spacing: -0.01em;
        }

        .arrow-icon {
            width: 3.8cqw;
            height: 3.8cqw;
            flex-shrink: 0;
        }

        .arrow-review {
            color: #8b5cf6;
        }

        .arrow-neutral {
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <main class="canvas-wrapper">
        
        <!-- Fondo con logo integrado -->
        <img 
            src="Paloma.webp" 
            alt="SKIN Care Consultant" 
            class="bg-full"
            fetchpriority="high"
            decoding="sync"
            loading="eager"
        >

        <!-- 4 Botones -->
        <nav class="buttons-stack">
            
            <!-- 1. Déjanos tu reseña -->
            <a href="https://search.google.com/local/writereview?placeid=ChIJuS2yQEYNLYQRekrsyr0fz8I" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-card btn-review">
                <div class="btn-left">
                    <div class="icon-box icon-box-review">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </div>
                    <span class="btn-label">Déjanos tu reseña</span>
                </div>
                <svg class="arrow-icon arrow-review" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>

            <!-- 2. Instagram -->
            <a href="https://www.instagram.com/skin_care.consultant?avpt=MTU3d3M1cWJ6dzBoag==" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-card btn-white">
                <div class="btn-left">
                    <div class="icon-box icon-box-neutral">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                        </svg>
                    </div>
                    <span class="btn-label">Instagram</span>
                </div>
                <svg class="arrow-icon arrow-neutral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>

            <!-- 3. Facebook -->
            <a href="https://www.facebook.com/share/1EMLA2Qp7n/" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-card btn-white">
                <div class="btn-left">
                    <div class="icon-box icon-box-neutral">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </div>
                    <span class="btn-label">Facebook</span>
                </div>
                <svg class="arrow-icon arrow-neutral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>

            <!-- 4. Contáctanos (WhatsApp) -->
            <a href="https://wa.me/524438367349" 
               target="_blank" 
               rel="noopener noreferrer"
               class="btn-card btn-white">
                <div class="btn-left">
                    <div class="icon-box icon-box-neutral">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                    </div>
                    <span class="btn-label">Contáctanos</span>
                </div>
                <svg class="arrow-icon arrow-neutral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>

        </nav>
    </main>

</body>
</html>
